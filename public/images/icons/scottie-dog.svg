<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tail (upright, curled tip) -->
  <path d="M12 36 Q5 26 9 16 Q13 10 16 18 Q14 27 14 36 Z" fill="#111"/>
  <!-- Body -->
  <path d="M14 48 L14 28 Q14 22 22 21 L44 21 Q52 21 52 30 L52 48 Z" fill="#1a1a1a"/>
  <!-- Neck to head connector -->
  <rect x="40" y="20" width="14" height="14" rx="4" fill="#1a1a1a"/>
  <!-- Head -->
  <rect x="38" y="10" width="20" height="16" rx="5" fill="#1a1a1a"/>
  <!-- Ear (pointed upright) -->
  <polygon points="44,10  48,2  54,9" fill="#111"/>
  <!-- Snout (distinctive Scottie beard) -->
  <path d="M56 20 Q62 21 62 28 L56 28 Z" fill="#1a1a1a"/>
  <!-- Lower beard tuft -->
  <path d="M56 28 Q62 30 60 36 L52 33 Z" fill="#1a1a1a"/>
  <!-- Eye -->
  <circle cx="52" cy="17" r="2.5" fill="#fff"/>
  <circle cx="53" cy="17" r="1.3" fill="#000"/>
  <!-- Nose -->
  <ellipse cx="61" cy="23" rx="1.8" ry="1.5" fill="#000"/>
  <!-- Eyebrow tufts -->
  <path d="M48 11 Q52 9 56 11" stroke="#555" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Legs (4 short, stubby) -->
  <rect x="14" y="46" width="7" height="14" rx="3" fill="#111"/>
  <rect x="24" y="46" width="7" height="14" rx="3" fill="#111"/>
  <rect x="34" y="46" width="7" height="12" rx="3" fill="#111"/>
  <rect x="43" y="44" width="7" height="10" rx="3" fill="#111"/>
  <!-- Fur texture on back -->
  <path d="M16 22 Q22 18 30 22" stroke="#333" stroke-width="1.2" fill="none"/>
  <path d="M30 22 Q38 18 44 22" stroke="#333" stroke-width="1.2" fill="none"/>
</svg>
