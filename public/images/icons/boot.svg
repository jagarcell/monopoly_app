  <rect x="20" y="10" width="8" height="20" rx="1" fill="#7a3a0a" opacity="0.3"/>
  <!-- Lace lines -->
  <line x1="21" y1="14" x2="27" y2="14" stroke="#5C2E00" stroke-width="1.2"/>
  <line x1="21" y1="19" x2="27" y2="19" stroke="#5C2E00" stroke-width="1.2"/>
  <line x1="21" y1="24" x2="27" y2="24" stroke="#5C2E00" stroke-width="1.2"/>
  <!-- Foot platform -->
  <path d="M18 36 Q18 42 22 44 L54 44 L54 38 Q54 36 50 36 L28 36 Z" fill="#8B4513"/>
  <!-- Toe shine -->
  <path d="M44 38 Q52 38 52 40 Q50 36 44 36 Z" fill="#C4783C" opacity="0.4"/>
  <!-- Heel block -->
  <rect x="18" y="36" width="10" height="12" rx="2" fill="#5C2E00"/>
  <!-- Sole -->
  <path d="M18 44 L54 44 L54 50 Q54 52 50 52 L22 52 Q14 52 14 49 L14 47 Q14 44 18 44 Z" fill="#3a1a00"/>
