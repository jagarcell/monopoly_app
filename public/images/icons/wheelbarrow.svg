<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tray / bucket body -->
  <path d="M16 18 L48 18 L44 42 L20 42 Z" fill="#A0A0A0"/>
  <!-- Tray front rim -->
  <rect x="16" y="16" width="32" height="4" rx="1" fill="#C0C0C0"/>
  <!-- Tray highlight -->
  <path d="M18 18 L46 18 L43 24 L21 24 Z" fill="#D8D8D8" opacity="0.4"/>
  <!-- Left handle -->
  <line x1="20" y1="42" x2="4" y2="58" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <!-- Right handle -->
  <line x1="44" y1="42" x2="60" y2="58" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <!-- Handle grips -->
  <rect x="1" y="56" width="6" height="4" rx="2" fill="#666"/>
  <rect x="57" y="56" width="6" height="4" rx="2" fill="#666"/>
  <!-- Wheel fork arm -->
  <line x1="32" y1="42" x2="32" y2="52" stroke="#888" stroke-width="3"/>
  <!-- Wheel -->
  <circle cx="32" cy="52" r="9" fill="#707070"/>
  <circle cx="32" cy="52" r="6" fill="#909090"/>
  <circle cx="32" cy="52" r="2.5" fill="#555"/>
  <!-- Wheel spokes -->
  <line x1="32" y1="45" x2="32" y2="59" stroke="#666" stroke-width="1.3"/>
  <line x1="25" y1="52" x2="39" y2="52" stroke="#666" stroke-width="1.3"/>
  <line x1="27" y1="47" x2="37" y2="57" stroke="#666" stroke-width="1.3"/>
  <line x1="37" y1="47" x2="27" y2="57" stroke="#666" stroke-width="1.3"/>
  <!-- Under-tray support strut left -->
  <line x1="20" y1="42" x2="26" y2="52" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Under-tray support strut right -->
  <line x1="44" y1="42" x2="38" y2="52" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>
</svg>
