<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rear wing vertical -->
  <rect x="4" y="28" width="4" height="14" rx="1" fill="#AA1100"/>
  <!-- Rear wing horizontal -->
  <rect x="2" y="26" width="10" height="3" rx="1" fill="#CC2200"/>
  <!-- Body main -->
  <path d="M8 40 Q10 28 22 26 L44 26 Q54 26 58 34 L58 42 L8 42 Z" fill="#CC2200"/>
  <!-- Nose cone -->
  <path d="M56 34 L62 37 L62 40 L56 42 Z" fill="#BB1100"/>
  <!-- Cockpit -->
  <path d="M26 26 Q30 17 40 17 Q48 17 50 26 Z" fill="#AA1100"/>
  <!-- Cockpit windscreen -->
  <ellipse cx="37" cy="22" rx="9" ry="5" fill="#AADDFF" opacity="0.55"/>
  <!-- Exhaust pipes -->
  <rect x="6" y="34" width="7" height="2" rx="1" fill="#888"/>
  <rect x="6" y="37" width="7" height="2" rx="1" fill="#888"/>
  <!-- Rear wheel -->
  <circle cx="18" cy="43" r="9" fill="#1a1a1a"/>
  <circle cx="18" cy="43" r="6" fill="#333"/>
  <circle cx="18" cy="43" r="2.5" fill="#888"/>
  <!-- Rear wheel spokes -->
  <line x1="18" y1="37" x2="18" y2="49" stroke="#666" stroke-width="1.2"/>
  <line x1="12" y1="43" x2="24" y2="43" stroke="#666" stroke-width="1.2"/>
  <line x1="14" y1="39" x2="22" y2="47" stroke="#666" stroke-width="1.2"/>
  <line x1="22" y1="39" x2="14" y2="47" stroke="#666" stroke-width="1.2"/>
  <!-- Front wheel -->
  <circle cx="50" cy="43" r="8" fill="#1a1a1a"/>
  <circle cx="50" cy="43" r="5" fill="#333"/>
  <circle cx="50" cy="43" r="2" fill="#888"/>
  <!-- Front wheel spokes -->
  <line x1="50" y1="38" x2="50" y2="48" stroke="#666" stroke-width="1.2"/>
  <line x1="45" y1="43" x2="55" y2="43" stroke="#666" stroke-width="1.2"/>
  <line x1="47" y1="40" x2="53" y2="46" stroke="#666" stroke-width="1.2"/>
  <line x1="53" y1="40" x2="47" y2="46" stroke="#666" stroke-width="1.2"/>
  <!-- Body highlight -->
  <path d="M22 27 Q30 23 40 23 Q46 23 48 26 L40 26 Q30 22 22 26 Z" fill="#FF5533" opacity="0.4"/>
  <!-- Race number -->
  <text x="28" y="39" font-family="Arial" font-size="7" font-weight="bold" fill="#fff" opacity="0.7">1</text>
</svg>
